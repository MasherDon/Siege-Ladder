<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Where a decode token's time goes</title>
<desc id="d">compute only 15.9 ms; compute and copies at once 3 ms; expert copies only 27.1 ms; idle 8.1 ms; idle includes 7.2 ms waiting for NVMe.</desc>
<rect width="760" height="222" rx="8" fill="#fcfcfb"/>
<text x="24" y="30" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Where a decode token's time goes</text>
<text x="24" y="50" font-size="12.5" fill="#52514e" text-anchor="start">GPU timeline of one token under Nsight: 54 ms (about 49-50 ms without the profiler).</text>
<text x="24" y="67" font-size="12.5" fill="#52514e" text-anchor="start">For half of it the GPU computes nothing and only copies experts from RAM over PCIe 4.0.</text>
<rect x="24" y="87" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="39" y="96" font-size="12" fill="#52514e" text-anchor="start">compute only</text>
<rect x="140.2" y="87" width="10" height="10" rx="2" fill="#1baf7a"/>
<text x="155.2" y="96" font-size="12" fill="#52514e" text-anchor="start">compute and copies at once</text>
<rect x="348.8" y="87" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="363.8" y="96" font-size="12" fill="#52514e" text-anchor="start">expert copies only</text>
<rect x="504.6" y="87" width="10" height="10" rx="2" fill="#898781"/>
<text x="519.6" y="96" font-size="12" fill="#52514e" text-anchor="start">idle</text>
<rect x="64" y="120" width="193.5" height="24" fill="#2a78d6"/>
<text x="160.7" y="162" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">15.9 ms</text>
<rect x="259.5" y="120" width="34.8" height="24" fill="#1baf7a"/>
<text x="276.9" y="162" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">3.0 ms</text>
<rect x="296.3" y="120" width="326.7" height="24" fill="#eb6834"/>
<text x="459.6" y="162" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">27.1 ms</text>
<path d="M624.9,120 h92.6 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-92.6 z" fill="#898781"/>
<text x="673.2" y="162" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">8.1 ms</text>
<line x1="64" y1="182" x2="732" y2="182" stroke="#c3c2b7" stroke-width="1"/>
<line x1="64" y1="182" x2="64" y2="186" stroke="#c3c2b7" stroke-width="1"/>
<text x="64" y="199" font-size="11" fill="#898781" text-anchor="middle">0</text>
<line x1="185.5" y1="182" x2="185.5" y2="186" stroke="#c3c2b7" stroke-width="1"/>
<text x="185.5" y="199" font-size="11" fill="#898781" text-anchor="middle">10</text>
<line x1="306.9" y1="182" x2="306.9" y2="186" stroke="#c3c2b7" stroke-width="1"/>
<text x="306.9" y="199" font-size="11" fill="#898781" text-anchor="middle">20</text>
<line x1="428.4" y1="182" x2="428.4" y2="186" stroke="#c3c2b7" stroke-width="1"/>
<text x="428.4" y="199" font-size="11" fill="#898781" text-anchor="middle">30</text>
<line x1="549.8" y1="182" x2="549.8" y2="186" stroke="#c3c2b7" stroke-width="1"/>
<text x="549.8" y="199" font-size="11" fill="#898781" text-anchor="middle">40</text>
<line x1="671.3" y1="182" x2="671.3" y2="186" stroke="#c3c2b7" stroke-width="1"/>
<text x="671.3" y="199" font-size="11" fill="#898781" text-anchor="middle">50</text>
<text x="732" y="199" font-size="11" fill="#898781" text-anchor="end">ms</text>
<text x="672.2" y="112" font-size="11" fill="#52514e" text-anchor="middle">7.2 ms of it: waiting for NVMe</text>
<text x="24" y="212" font-size="10.5" fill="#898781" text-anchor="start">Default preset, short context, 223 tokens; data: docs/data/decode-token.csv</text>
</svg>
