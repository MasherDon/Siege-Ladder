<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" width="760" height="258" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Expert reads from one, two and three NVMe drives</title>
<desc id="d">one drive: Gen5 2 TB (the model) 13.51 GB/s; two: Gen5 2 TB (the model) 13.68 GB/s, Gen4 1 TB (a copy of the experts) 5.18 GB/s; three: Gen5 2 TB (the model) 13.72 GB/s, Gen4 1 TB (a copy of the experts) 5.17 GB/s, system NVMe (x2 link) 3.44 GB/s</desc>
<rect width="760" height="258" rx="8" fill="#fcfcfb"/>
<text x="24" y="30" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Expert reads from one, two and three NVMe drives</text>
<text x="24" y="50" font-size="12.5" fill="#52514e" text-anchor="start">Unbuffered reads of one expert slab (3.4 MB) at a time, 12 / 4 / 4 in flight per drive (diskspd).</text>
<text x="24" y="67" font-size="12.5" fill="#52514e" text-anchor="start">The drives do not slow each other down; prompts read faster with each copy, decode waits for latency instead.</text>
<rect x="24" y="87" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="39" y="96" font-size="12" fill="#52514e" text-anchor="start">Gen5 2 TB (the model)</text>
<rect x="199.6" y="87" width="10" height="10" rx="2" fill="#1baf7a"/>
<text x="214.6" y="96" font-size="12" fill="#52514e" text-anchor="start">Gen4 1 TB (a copy of the experts)</text>
<rect x="454.4" y="87" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="469.4" y="96" font-size="12" fill="#52514e" text-anchor="start">system NVMe (x2 link)</text>
<text x="134" y="133" font-size="12" fill="#52514e" text-anchor="end">one drive</text>
<path d="M144,118 h303.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-303.3 z" fill="#2a78d6"/>
<text x="459.3" y="133" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">13.5 GB/s</text>
<text x="134" y="173" font-size="12" fill="#52514e" text-anchor="end">two</text>
<rect x="144" y="158" width="311.2" height="22" fill="#2a78d6"/>
<path d="M457.2,158 h111.8 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-111.8 z" fill="#1baf7a"/>
<text x="581.1" y="173" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">18.9 GB/s</text>
<text x="134" y="213" font-size="12" fill="#52514e" text-anchor="end">three</text>
<rect x="144" y="198" width="312.1" height="22" fill="#2a78d6"/>
<rect x="458.1" y="198" width="115.6" height="22" fill="#1baf7a"/>
<path d="M575.7,198 h72.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-72.3 z" fill="#eb6834"/>
<text x="660" y="213" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">22.3 GB/s</text>
<text x="24" y="248" font-size="10.5" fill="#898781" text-anchor="start">data: docs/data/drives.csv</text>
</svg>
